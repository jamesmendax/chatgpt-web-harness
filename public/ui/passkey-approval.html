<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Harness · 用户确认</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color-scheme:light dark}
body{max-width:700px;margin:42px auto;padding:0 24px;line-height:1.65}
header{margin-bottom:28px}h1{margin-bottom:4px}p{margin-top:4px}main{display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:600}input{padding:10px;border:1px solid #888;border-radius:6px;font:inherit;width:100%;box-sizing:border-box}
button{border:0;border-radius:7px;padding:12px 16px;font-weight:650;background:#1b62b8;color:white;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}article{padding:14px;border:1px solid #999;border-radius:8px}
#details{white-space:pre-wrap;word-break:break-word}#status{font-weight:600}
.small{font-size:.9em;opacity:.8}a{color:inherit}
</style></head>
<body><header><h1>Web Harness · 独立用户确认</h1>
<p>此页面只批准你看到的具体 Goal 指标，不代表 ChatGPT Host 签发用户消息。</p>
<p class="small">只有你本人完成 Windows Hello／通行密钥验证后才提交。当前 3.0.2 运行实例不使用本页面。</p></header>
<main>
<label>管理令牌（仅在当前页面内使用，不会持久保存）<input id="admin" type="password" autocomplete="off" spellcheck="false"></label>
<label>Goal 所属 ChatGPT 会话 ID<input id="session" type="text" autocomplete="off" spellcheck="false"></label>
<label>需要确认的指标名称<input id="criterion" type="text" autocomplete="off"></label>
<button type="button" id="begin">查看需要批准的具体内容</button>
<article hidden id="review"><h2>请核对确认对象</h2><div id="details"></div>
<p>仅当上面的目标、修订号与事项完全符合你的真实意图时，再使用系统通行密钥批准。</p>
<button type="button" id="approve">使用 Windows Hello／通行密钥确认</button></article>
<div id="status" role="status" aria-live="polite"></div>
<p class="small">首次使用需由你自行注册通行密钥，并将公开凭据独立交给可信运营者固定。<a href="/approval/enroll">注册说明与本机注册页面</a></p>
</main>
<script>
(() => {
  const byId = (id) => document.getElementById(id);
  let pending=null;
  const status=(message)=>{byId("status").textContent=message;};
  const fromB64url=(text)=>{
    const base=text.replace(/-/g,"+").replace(/_/g,"/");
    const binary=atob(base+"=".repeat((4-base.length%4)%4));
    return Uint8Array.from(binary,(char)=>char.charCodeAt(0));
  };
  const toB64url=(buf)=>{
    let s="";const data=new Uint8Array(buf);
    for(const part of data)s+=String.fromCharCode(part);
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  };
  const call=async(route,body)=>{
    const token=byId("admin").value.trim();
    if(!token)throw Error("需要已配置的管理令牌");
    const response=await fetch("/approval/api/"+route,{
      method:"POST",mode:"same-origin",credentials:"omit",cache:"no-store",
      headers:{"content-type":"application/json",authorization:"Bearer "+token},
      body:JSON.stringify(body)
    });
    const result=await response.json();
    if(!response.ok||!result.ok)throw Error(result.error||"确认请求失败");
    return result;
  };
  byId("begin").addEventListener("click",async()=>{
    pending=null;byId("review").hidden=true;status("正在检查 Goal 及指标…");
    try{
      const result=await call("begin",{
        owner_session:byId("session").value.trim(),
        criterion:byId("criterion").value.trim(),
      });
      pending=result;
      byId("details").textContent=
        "Goal ID："+result.goal_id+"\n修订号："+result.goal_revision+
        "\n目标："+result.goal_objective+"\n确认事项："+result.criterion+
        "\n失效时间："+new Date(result.expires_at_ms).toLocaleTimeString();
      byId("review").hidden=false;
      status("已取得一次性挑战。请仔细核对后再批准。");
    }catch(error){status("拒绝："+error.message);}
  });
  byId("approve").addEventListener("click",async()=>{
    if(!pending)return;
    byId("approve").disabled=true;
    status("等待用户亲自完成通行密钥验证…");
    try{
      const opts=pending.public_key;
      const credential=await navigator.credentials.get({
        publicKey:{
          challenge:fromB64url(opts.challenge),
          rpId:opts.rpId,
          allowCredentials:opts.allowCredentials.map(x=>({
            type:x.type,id:fromB64url(x.id)
          })),
          userVerification:"required",timeout:opts.timeout,
        }
      });
      if(!credential||!credential.response)throw Error("未获得通行密钥签名");
      const proof={
        id:toB64url(credential.rawId),type:credential.type,
        client_data_json_base64url:toB64url(credential.response.clientDataJSON),
        authenticator_data_base64url:toB64url(credential.response.authenticatorData),
        signature_base64url:toB64url(credential.response.signature),
      };
      const done=await call("finish",{request_id:pending.request_id,assertion:proof});
      status("已验证：指标 "+done.criterion+"；Goal ID "+done.goal_id+
        "；修订号 "+done.goal_revision+"。");
      pending=null;byId("review").hidden=true;
    }catch(error){status("未确认："+error.message);}
    finally{byId("approve").disabled=false;}
  });
})();
</script></body></html>
