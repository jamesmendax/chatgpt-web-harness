<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2 • Companion isolated Chromium DOM test (not ChatGPT)</title>
<style>
  :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; background:#f4f6fa; color:#16243e }
  body { max-width: 900px; margin: 0 auto; padding: 36px 24px; }
  h1 { font-size: 25px; letter-spacing: -.02em; margin: 0 0 8px }
  p { margin: 0 0 24px; color:#52617a }
  .shell { padding: 22px; background: white; border: 1px solid #e0e6f0; border-radius: 15px; box-shadow: 0 8px 28px #1b345314; }
  .tabs { display:flex; gap:8px; margin:0 0 22px }
  .tabs button { border:0; padding:8px 20px; border-radius:10px; color:#365170; background:#f1f3f8; cursor:pointer; }
  .tabs [aria-pressed=true] { color:white; background:#224fa3; }
  #transcript { min-height: 160px; display:flex; flex-direction:column; gap:14px; padding:8px 0 20px; }
  article { display:block; border-radius:12px; border:1px solid #e2e8f2; padding:12px 15px; background:#f9fbfd; }
  article[data-message-author-role="assistant"] { border-left:4px solid #558cef; }
  article[data-message-author-role="user"] { align-self: end; border-color: #d1e4ce; background:#f4fff4; }
  #prompt-textarea { min-height:40px; flex:1; outline:none; border:1px solid #cbd6e7; border-radius:9px; padding:9px; }
  .input-row { display:flex; gap:12px; align-items:start; }
  #send { background:#2757bb; color:white; border:none; border-radius:10px; padding:11px 18px; cursor:pointer; }
  .notice { font-size:12px; color:#a44025; font-weight:600; text-transform:uppercase; letter-spacing:.06em }
</style>
<script>
  // Fake Companion transport. This fixture has NO external account/API and
  // never sends transcript, credentials, or a real ChatGPT message.
  window.chrome = { runtime: { sendMessage: async () => ({ok:true}) } };
  window.__fixture = { sendTrusted:null, replies:0, clicked:0 };
</script>
</head>
<body>
<div class="notice">Isolated local test only · NOT ChatGPT · no login</div>
<h1>Browser Companion · one-shot DOM visibility</h1>
<p>The page executes the actual 3.0.3 Companion content script against a real Chromium DOM.</p>
<section class="shell">
  <div class="tabs">
    <button type="button" aria-pressed="true">Chat</button>
    <button type="button" aria-pressed="false">Work</button>
  </div>
  <main id="transcript">
    <article id="historic" data-message-author-role="assistant" data-message-id="fixture-old-1">Earlier assistant answer, before the new user turn.</article>
  </main>
  <div class="input-row">
    <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Ask ChatGPT">Example user message</div>
    <button id="send" data-testid="send-button" aria-label="Send message" type="button">Send</button>
  </div>
</section>
<script src="../browser-companion/visible-feedback-ledger.js"></script>
<script src="../browser-companion/content.js"></script>
<script>
(() => {
  const area = document.querySelector("#transcript");
  const send = document.querySelector("#send");
  function reply(message, identity) {
    const node = document.createElement("article");
    node.setAttribute("data-message-author-role", "assistant");
    node.setAttribute("data-message-id", identity);
    node.textContent = message;
    area.appendChild(node);
    window.__fixture.replies++;
    return node;
  }
  send.addEventListener("click", e => {
    window.__fixture.clicked++;
    window.__fixture.sendTrusted = e.isTrusted;
    // Faster than the Companion 2000ms polling interval.
    setTimeout(() => reply("Fast assistant reply completed in the browser", "fixture-fast-1"), 35);
  });
  window.__probe = () => {
    const t = telemetry();
    const s = t.feedback_ledger?.signals || {};
    return {
      url: location.protocol, real_click_is_trusted:window.__fixture.sendTrusted,
      turn_id:t.turn_id, conversation_surface:t.conversation_surface, replies:window.__fixture.replies,
      text_revision:t.feedback_ledger?.text_revision,
      text_rendered:s.assistant_text_rendered,
      host_emitted:s.assistant_text_emitted,
      transport:s.transport_state,
      assistant_node_count:document.querySelectorAll("[data-message-author-role='assistant']").length,
    };
  };
  window.__hydrateHistorical = () => reply("Historical response rehydrated without a send", "fixture-rehydrated-old");
  window.__removeFast = () => {
    const n = document.querySelector('[data-message-id="fixture-fast-1"]');
    if (n) { window.__fixture.removedNode=n; n.remove(); }
  };
  window.__restoreFast = () => {
    if (window.__fixture.removedNode) area.appendChild(window.__fixture.removedNode);
  };
  window.__replaceOlderWithSame = () => {
    const n = document.querySelector('[data-message-id="fixture-fast-1"]');
    if (n) { const clone=n.cloneNode(true); n.replaceWith(clone); }
  };
})();
</script>
</body>
</html>
